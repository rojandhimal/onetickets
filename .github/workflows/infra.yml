name: Infra

# Checks Terraform on every change to infra/. Needs no AWS access: plans and
# applies are run by a person until the accounts exist (see infra/README.md).

on:
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/infra.yml'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/staging-power.yml'
  push:
    branches: [main]
    paths:
      - 'infra/**'

permissions:
  contents: read

jobs:
  validate:
    name: Terraform format and validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        stack: [organization, envs/staging, envs/production, edge]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.13.3
      - name: Format
        run: terraform fmt -check -recursive -diff infra
      - name: Validate
        working-directory: infra/${{ matrix.stack }}
        run: |
          terraform init -backend=false -input=false
          terraform validate

  scripts:
    name: Shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck infra/scripts/*.sh
