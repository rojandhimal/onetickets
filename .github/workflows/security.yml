name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, so new advisories against unchanged dependencies still surface.
    - cron: '0 20 * * 0'

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (checksum verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" "$base/$tarball"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tarball}\$" checksums.txt | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
      - name: Scan commits in this change
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            gitleaks git --redact --verbose --log-opts="origin/${BASE_REF}..HEAD" .
          else
            gitleaks git --redact --verbose .
          fi

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Audit production dependencies (fail on high or critical)
        run: pnpm audit --prod --audit-level=high
      - name: Audit all dependencies (report only)
        run: pnpm audit --audit-level=high || echo "::warning::High or critical advisories in dev dependencies; see log"
