name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, type check and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format:check
      - name: Lint and module boundaries
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build

  integration:
    name: Integration tests (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Migrate as onetickets_owner, which like the RDS master user is not a superuser; seed as
      # the superuser (RLS is forced on the owner too); run the api as an RLS-bound role.
      MIGRATION_DATABASE_URL: postgres://onetickets_owner:onetickets_owner@localhost:5432/onetickets
      TEST_SUPERUSER_DATABASE_URL: postgres://postgres:postgres@localhost:5432/onetickets
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @onetickets/shared build
      - name: Create the database owner (as on RDS)
        run: psql postgres://postgres:postgres@localhost:5432/postgres -f scripts/db/create-owner.sql
      - name: Integration tests
        run: pnpm test:integration

  e2e:
    name: E2E and accessibility (Playwright)
    needs: integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Migrate as onetickets_owner (not a superuser, like RDS); the api runs as onetickets_app
      # (granted ot_app, RLS applies).
      MIGRATION_DATABASE_URL: postgres://onetickets_owner:onetickets_owner@localhost:5432/onetickets
      DATABASE_URL: postgres://onetickets_app:onetickets_app@localhost:5432/onetickets
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Create the database owner (as on RDS)
        run: psql postgres://postgres:postgres@localhost:5432/postgres -f scripts/db/create-owner.sql
      - name: Migrate and create the api's database role
        run: ./e2e/setup-db.sh
      - name: Install Chromium
        run: pnpm --filter @onetickets/e2e exec playwright install --with-deps chromium
      - name: E2E tests at 375 px and 1280 px
        run: pnpm e2e
      # Traces hold test data only (example.com sign-ups on a throwaway database). This job's env
      # must never carry a secret while these artifacts are uploaded: traces record requests.
      - name: Upload Playwright traces and the api log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-results
          path: |
            e2e/test-results/
            e2e/.logs/api.log
          retention-days: 7
          if-no-files-found: ignore
          # The api log is under e2e/.logs, a hidden folder that upload-artifact skips by default.
          include-hidden-files: true

  images:
    # Builds each app's production image the way deploy.yml does, without pushing, so a broken
    # Dockerfile or a build step that only fails inside the image (#18) is caught before merge.
    name: Docker image (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build the ${{ matrix.app }} image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/amd64
          push: false
          # The same build args as deploy.yml (a public DSN), so both write the same cache layers.
          build-args: NEXT_PUBLIC_SENTRY_DSN=${{ vars.SENTRY_WEB_DSN }}
          # Same cache scope as deploy.yml. Pull requests read it; only main writes it, so open
          # pull requests don't use up the repository's cache quota and evict main's layers.
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: ${{ github.ref == 'refs/heads/main' && format('type=gha,mode=max,scope={0}', matrix.app) || '' }}
          # Loaded into the runner's Docker so the next step can look inside it.
          load: true
          tags: onetickets-${{ matrix.app }}:ci
      # In AWS, DATABASE_URL points sslrootcert at the RDS CA bundle inside the image (SEC-6).
      # Nothing in CI connects over TLS, so check here that the file the URL names is in the
      # image and is the bundle in apps/api/certs. Otherwise a dropped `files` entry in
      # apps/api/package.json would only show when tasks fail to start in AWS.
      - name: Check the api image carries the RDS CA bundle
        if: matrix.app == 'api'
        run: |
          path=$(grep -o 'sslrootcert=[^&"]*' infra/modules/database/main.tf | cut -d= -f2)
          test -n "$path" || { echo "No sslrootcert in infra/modules/database/main.tf"; exit 1; }
          expected=$(sha256sum "apps/api/certs/$(basename "$path")" | cut -d' ' -f1)
          actual=$(docker run --rm --entrypoint sha256sum onetickets-api:ci "$path" | cut -d' ' -f1)
          echo "sslrootcert=$path expected=$expected actual=$actual"
          test "$actual" = "$expected"
