name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, type check and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format:check
      - name: Lint and module boundaries
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build

  integration:
    name: Integration tests (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Migrate as onetickets_owner, which like the RDS master user is not a superuser; seed as
      # the superuser (RLS is forced on the owner too); run the api as an RLS-bound role.
      MIGRATION_DATABASE_URL: postgres://onetickets_owner:onetickets_owner@localhost:5432/onetickets
      TEST_SUPERUSER_DATABASE_URL: postgres://postgres:postgres@localhost:5432/onetickets
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @onetickets/shared build
      - name: Create the database owner (as on RDS)
        run: psql postgres://postgres:postgres@localhost:5432/postgres -f scripts/db/create-owner.sql
      - name: Integration tests
        run: pnpm test:integration

  e2e:
    name: E2E and accessibility (Playwright)
    needs: integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Migrate as onetickets_owner (not a superuser, like RDS); the api runs as onetickets_app
      # (granted ot_app, RLS applies).
      MIGRATION_DATABASE_URL: postgres://onetickets_owner:onetickets_owner@localhost:5432/onetickets
      DATABASE_URL: postgres://onetickets_app:onetickets_app@localhost:5432/onetickets
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Create the database owner (as on RDS)
        run: psql postgres://postgres:postgres@localhost:5432/postgres -f scripts/db/create-owner.sql
      - name: Migrate and create the api's database role
        run: ./e2e/setup-db.sh
      - name: Install Chromium
        run: pnpm --filter @onetickets/e2e exec playwright install --with-deps chromium
      - name: E2E tests at 375 px and 1280 px
        run: pnpm e2e
      # When a test fails, show what the page looked like and what the api complained about, so a
      # failure that only happens on CI can be root-caused from the log (QA-2). Sign-in links stay out.
      - name: Show failure context
        if: failure()
        run: |
          for f in e2e/test-results/*/error-context.md; do [ -f "$f" ] && { echo "::group::$f"; cat "$f"; echo "::endgroup::"; }; done
          echo "::group::api warnings and errors"
          grep -iE 'error|warn|exception' e2e/.logs/api.log | grep -viE 'sign-?in|token|magic' | tail -n 100 || true
          echo "::endgroup::"
