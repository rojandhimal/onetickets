name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, type check and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format:check
      - name: Lint and module boundaries
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build

  integration:
    name: Integration tests (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: onetickets
          POSTGRES_PASSWORD: onetickets
          POSTGRES_DB: onetickets
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U onetickets"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Tests migrate and seed with this superuser, then run the api as an RLS-bound role.
      MIGRATION_DATABASE_URL: postgres://onetickets:onetickets@localhost:5432/onetickets
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @onetickets/shared build
      - name: Integration tests
        run: pnpm test:integration
