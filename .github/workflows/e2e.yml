name: E2E

# Browser and accessibility tests. Owned by QA; kept apart from ci.yml so the two don't collide.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: E2E and accessibility (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: onetickets
          POSTGRES_PASSWORD: onetickets
          POSTGRES_DB: onetickets
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U onetickets"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://onetickets:onetickets@localhost:5432/onetickets
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install Chromium
        run: pnpm --filter @onetickets/e2e exec playwright install --with-deps chromium
      - name: E2E tests at 375 px and 1280 px
        run: pnpm e2e
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
