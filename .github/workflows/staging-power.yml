name: Staging power

# Staging switches itself off outside weekday hours (07:00-22:00 Sydney).
# Run this to wake it for a demo, or to switch it off early.

on:
  workflow_dispatch:
    inputs:
      direction:
        description: Turn staging on or off
        type: choice
        options: [up, down]
        default: up

permissions:
  contents: read

jobs:
  power:
    name: Staging ${{ inputs.direction }}
    if: vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: infra/scripts
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-2
      - run: infra/scripts/power.sh staging "${{ inputs.direction }}"
