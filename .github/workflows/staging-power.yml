name: Staging power

# Staging switches itself off outside weekday hours (07:00-22:00 Sydney).
# Run this to wake it for a demo, or to switch it off early.

on:
  workflow_dispatch:
    inputs:
      direction:
        description: Turn staging on or off
        type: choice
        options: [up, down]
        default: up

permissions:
  contents: read

jobs:
  power:
    name: Staging ${{ inputs.direction }}
    if: vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: infra/scripts
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-2
      - run: infra/scripts/power.sh staging "${{ inputs.direction }}"
