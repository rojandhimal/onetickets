name: Deploy

# After CI passes on main: build one image per app, deploy it to staging, then
# promote the same images to production once someone approves the
# `production` environment. Migrations run before each rollout.
#
# Off until the AWS accounts exist: set the repository variable
# DEPLOY_ENABLED=true and each environment's AWS_DEPLOY_ROLE_ARN
# (see infra/README.md).

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer merge waits instead of cancelling a rollout.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: ap-southeast-2
  # Apps with a Dockerfile at apps/<app>/Dockerfile, built from the repo root.
  APPS: api web

jobs:
  staging:
    name: Build and deploy to staging
    # Only pushes to this repository's main, never a CI run from a pull request
    # (a fork's branch can also be called main), and manual runs only from main.
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      (
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
        (github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_repository.full_name == github.repository)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: staging
      url: ${{ vars.APP_URL }}
    permissions:
      contents: read
      id-token: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      registry: ${{ steps.ecr.outputs.registry }}
      apps: ${{ steps.meta.outputs.apps }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Work out what to build
        id: meta
        run: |
          apps=""
          for app in $APPS; do
            if [ -f "apps/$app/Dockerfile" ]; then apps="$apps $app"; else echo "::warning::apps/$app/Dockerfile not found, skipping $app"; fi
          done
          case " $apps " in *" api "*) ;; *) echo "::error::apps/api/Dockerfile is required (migrations run from the api image)"; exit 1 ;; esac
          echo "apps=${apps# }" >> "$GITHUB_OUTPUT"
          echo "tag=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and push images
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          for app in ${{ steps.meta.outputs.apps }}; do
            image="$REGISTRY/onetickets/$app:$TAG"
            if aws ecr describe-images --repository-name "onetickets/$app" --image-ids imageTag="$TAG" >/dev/null 2>&1; then
              echo "$image already exists (tags are immutable), reusing it"
              continue
            fi
            docker buildx build --platform linux/amd64 \
              --file "apps/$app/Dockerfile" \
              --cache-from type=gha,scope=$app --cache-to type=gha,mode=max,scope=$app \
              --label org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha || github.sha }} \
              --tag "$image" --push .
          done

      - name: Migrate and deploy
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          args=()
          for app in ${{ steps.meta.outputs.apps }}; do args+=("$app=$REGISTRY/onetickets/$app:$TAG"); done
          infra/scripts/deploy.sh staging "${args[@]}"

  production:
    name: Promote to production
    needs: staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Required reviewers on this GitHub environment are the approval gate.
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          sparse-checkout: infra/scripts

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        with:
          registries: ${{ vars.STAGING_ACCOUNT_ID }},${{ vars.AWS_ACCOUNT_ID }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Copy, not rebuild: production runs the exact bytes staging tested.
      - name: Promote images from staging
        env:
          SOURCE: ${{ needs.staging.outputs.registry }}
          TARGET: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
          TAG: ${{ needs.staging.outputs.tag }}
        run: |
          for app in ${{ needs.staging.outputs.apps }}; do
            if aws ecr describe-images --repository-name "onetickets/$app" --image-ids imageTag="$TAG" >/dev/null 2>&1; then
              echo "$TARGET/onetickets/$app:$TAG already exists"
              continue
            fi
            docker buildx imagetools create --tag "$TARGET/onetickets/$app:$TAG" "$SOURCE/onetickets/$app:$TAG"
          done

      - name: Migrate and deploy
        env:
          REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
          TAG: ${{ needs.staging.outputs.tag }}
        run: |
          args=()
          for app in ${{ needs.staging.outputs.apps }}; do args+=("$app=$REGISTRY/onetickets/$app:$TAG"); done
          infra/scripts/deploy.sh production "${args[@]}"
