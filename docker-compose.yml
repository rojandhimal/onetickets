# Local Postgres matching CI. `docker compose up -d`, then copy apps/api/.env.example to apps/api/.env.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: onetickets
      POSTGRES_PASSWORD: onetickets
      POSTGRES_DB: onetickets
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
